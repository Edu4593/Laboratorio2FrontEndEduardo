<section class="card narrow">
  <h1>Iniciar sesión</h1>
  <p class="muted">Ingresa con tu usuario y contraseña para continuar.</p>

  @if (registrado) {
    <div class="alert alert-success">Cuenta creada. Ya puedes iniciar sesión.</div>
  }

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="entrar()">
    <label>
      Usuario
      <input type="text" formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <small class="error">El usuario es obligatorio</small>
      }
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">La contraseña es obligatoria</small>
      }
    </label>

    <div class="form-actions">
      <button type="submit" class="btn" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </div>

    <p class="muted">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </form>
</section>
