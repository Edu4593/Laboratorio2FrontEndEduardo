<section class="card medium">
  <h1>{{ esEdicion() ? 'Editar producto' : 'Nuevo producto' }}</h1>

  @if (mensajeError()) {
    <div class="alert alert-error">{{ mensajeError() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Nombre
      <input type="text" formControlName="nombre" />
      @if (campoInvalido('nombre')) {
        <small class="error">El nombre es obligatorio</small>
      }
    </label>

    <label>
      Descripción
      <textarea rows="3" formControlName="descripcion"></textarea>
    </label>

    <div class="form-row">
      <label>
        Precio
        <input type="number" step="0.01" min="0" formControlName="precio" />
        @if (campoInvalido('precio')) {
          <small class="error">Ingresa un precio válido (0 o mayor)</small>
        }
      </label>
      <label>
        Stock
        <input type="number" step="1" min="0" formControlName="stock" />
        @if (campoInvalido('stock')) {
          <small class="error">Ingresa un stock válido (0 o mayor)</small>
        }
      </label>
    </div>

    <label>
      Categoría
      <select formControlName="categoriaId">
        <option [ngValue]="null" disabled>Selecciona una categoría</option>
        @for (categoria of categorias(); track categoria.id) {
          <option [ngValue]="categoria.id">{{ categoria.nombre }}</option>
        }
      </select>
      @if (campoInvalido('categoriaId')) {
        <small class="error">Debes seleccionar una categoría</small>
      }
    </label>

    <div class="form-actions">
      <button type="submit" class="btn" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : esEdicion() ? 'Actualizar' : 'Crear' }}
      </button>
      <a class="btn btn-secondary" routerLink="/productos">Cancelar</a>
    </div>
  </form>
</section>
